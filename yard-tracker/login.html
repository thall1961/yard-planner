<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Yard Helper</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .login-box {
      max-width: 360px; margin: 14vh auto 0; background: var(--card);
      border: 1px solid var(--line); border-radius: 14px; padding: 2rem;
      text-align: center;
    }
    .login-box h1 { font-size: 1.3rem; margin-bottom: 0.3rem; }
    .login-box p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.2rem; }
    .login-box input {
      width: 100%; padding: 0.65rem 0.9rem; border: 1px solid var(--line);
      border-radius: 8px; font: inherit; margin-bottom: 0.7rem;
    }
    .login-box button {
      width: 100%; padding: 0.65rem; border: 0; border-radius: 8px; font: inherit;
      font-weight: 600; background: var(--green); color: #fff; cursor: pointer;
    }
    .login-box .err { color: #b53a3a; font-size: 0.85rem; margin-top: 0.7rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>🌱 Yard Helper</h1>
    <p>Enter the password to continue</p>
    <form id="f">
      <input type="password" id="pw" placeholder="Password" autofocus>
      <button type="submit">Sign in</button>
    </form>
    <div class="err" id="err"></div>
  </div>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("pw").value }),
      });
      if (res.ok) location.href = "/front";
      else document.getElementById("err").textContent = "Wrong password, try again.";
    });
  </script>
</body>
</html>
